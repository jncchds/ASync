name: Build and Publish Docker Images

# Images are published when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Pull requests only run the tests; a manual run (workflow_dispatch) builds and publishes the chosen ref.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Runners are pinned to an Ubuntu release (ubuntu-latest moves to a new one on GitHub's schedule): move them on purpose.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build (warnings are errors)
        run: dotnet build ASync.slnx --configuration Release -warnaserror

      # Real S3 (SeaweedFS), SFTP, WebDAV and Samba servers for the storage back-end conformance tests, and the
      # PostgreSQL of the API-level tests (src/ASync.Tests/Api: role separation and ownership on every endpoint).
      # --wait returns once every container's health check passes (each one checks that the server serves requests).
      - name: Start test servers
        run: docker compose -f docker-compose.test.yml -p async-test up -d --wait --wait-timeout 180

      # Failed tests show as annotations and in the job summary (GitHubActionsTestLogger); the TRX is an artifact.
      - name: Run tests
        run: |
          eval "$(scripts/test-backends-env.sh)"
          dotnet test src/ASync.Tests/ASync.Tests.csproj --configuration Release --no-build \
            --logger "GitHubActions;summary-include-passed=false" \
            --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Test server logs
        if: failure()
        run: docker compose -f docker-compose.test.yml -p async-test logs --no-color --tail 200 > test-servers.log; cat test-servers.log

      - name: Upload test server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-server-logs
          path: test-servers.log

      # The Docker image build runs `vite build` only, which does not type-check.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/async-ui/package-lock.json

      - name: Type-check and lint UI
        working-directory: src/async-ui
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npx eslint .

  # The agent on the desktop systems: builds async-cli, the agent and the tests there (DPAPI, named pipes, the Keychain
  # binding and launchd/Task Scheduler code only compile on Linux) and runs the agent's unit tests, which need no Docker:
  # the control protocol over a named pipe (Windows) or a Unix socket (macOS), the single-instance lock, CLI routing,
  # the service files, secrets (DPAPI on Windows). Installing a real service is only exercised on Linux (smoke test).
  agent-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build agent, CLI and tests (warnings are errors)
        run: |
          dotnet build src/ASync.Cli/ASync.Cli.csproj --configuration Release -warnaserror
          dotnet build src/ASync.Tests/ASync.Tests.csproj --configuration Release -warnaserror

      - name: Agent unit tests
        run: >
          dotnet test src/ASync.Tests/ASync.Tests.csproj --configuration Release --no-build
          --filter "FullyQualifiedName~ASync.Tests.Agent"
          --logger "GitHubActions;summary-include-passed=false"

  # The real server stack (docker compose) with two async-cli agents plus one in the async-cli image: TwoWay, Mirror,
  # Backup (Transport and end-to-end), live updates and revocation. See scripts/e2e-sync.cs.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: End-to-end sync test
        run: scripts/e2e-sync.sh

  build-and-push:
    needs: [test, e2e, agent-desktop]
    # Pull requests only run the tests; images are published from version tags (and manual runs).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: async-server
            dockerfile: Dockerfile
          - image: async-cli
            dockerfile: Dockerfile.cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          version=$(cat VERSION)
          echo "value=$version" >> $GITHUB_OUTPUT
          # A release tag must match VERSION, so the image tags and the version the app reports agree.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Tag v$version instead."
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
