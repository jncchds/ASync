name: Build, test and release

# A version tag (git tag v0.1.1 && git push origin v0.1.1) publishes the Docker images and a published GitHub Release
# with the desktop installers, the async-cli archives and packages, the Android APK and the Velopack update feed, once
# every test job has passed: installed apps see it at once. Pull requests run the tests and build every package (nothing is published); a manual run
# (workflow_dispatch) builds and publishes the images of the chosen ref, and builds the packages without a release.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Runners are pinned to an Ubuntu release (ubuntu-latest moves to a new one on GitHub's schedule): move them on purpose.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build (warnings are errors)
        run: dotnet build ASync.slnx --configuration Release -warnaserror

      # Real S3 (SeaweedFS), SFTP, WebDAV and Samba servers for the storage back-end conformance tests, and the
      # PostgreSQL of the API-level tests (src/ASync.Tests/Api: role separation and ownership on every endpoint).
      # --wait returns once every container's health check passes (each one checks that the server serves requests).
      - name: Start test servers
        run: docker compose -f docker-compose.test.yml -p async-test up -d --wait --wait-timeout 180

      # Failed tests show as annotations and in the job summary (GitHubActionsTestLogger); the TRX is an artifact.
      - name: Run tests
        run: |
          eval "$(scripts/test-backends-env.sh)"
          dotnet test src/ASync.Tests/ASync.Tests.csproj --configuration Release --no-build \
            --logger "GitHubActions;summary-include-passed=false" \
            --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      # The app's view models and its views in Avalonia.Headless (no display needed).
      - name: Run app tests
        run: >
          dotnet test src/ASync.App.Tests/ASync.App.Tests.csproj --configuration Release --no-build
          --logger "trx;LogFileName=app-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Test server logs
        if: failure()
        run: docker compose -f docker-compose.test.yml -p async-test logs --no-color --tail 200 > test-servers.log; cat test-servers.log

      - name: Upload test server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-server-logs
          path: test-servers.log

      # The Docker image build runs `vite build` only, which does not type-check.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/async-ui/package-lock.json

      - name: Type-check and lint UI
        working-directory: src/async-ui
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npx eslint .

  # The agent and the desktop app on the desktop systems: builds async-cli, the agent, the desktop app (async-desktop) and
  # the tests there (DPAPI, named pipes, the Keychain binding, launchd/Task Scheduler, the Run key and the toast code are
  # only compiled on Linux) and runs the agent's unit tests, which need no Docker: the control protocol over a named pipe
  # (Windows) or a Unix socket (macOS), the single-instance lock, CLI routing, the service files, secrets (DPAPI on
  # Windows), and the app's view-model and headless view tests. Installing a real service and running the real app are
  # only exercised on Linux (scripts/smoke-agent-service.sh, scripts/smoke-desktop.sh).
  agent-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build agent, CLI, desktop app and tests (warnings are errors)
        run: |
          dotnet build src/ASync.Cli/ASync.Cli.csproj --configuration Release -warnaserror
          dotnet build src/ASync.Tests/ASync.Tests.csproj --configuration Release -warnaserror
          dotnet build src/ASync.App.Desktop/ASync.App.Desktop.csproj --configuration Release -warnaserror
          dotnet build src/ASync.App.Tests/ASync.App.Tests.csproj --configuration Release -warnaserror

      - name: Agent unit tests
        run: >
          dotnet test src/ASync.Tests/ASync.Tests.csproj --configuration Release --no-build
          --filter "FullyQualifiedName~ASync.Tests.Agent"
          --logger "GitHubActions;summary-include-passed=false"

      - name: App tests (view models, headless views)
        run: dotnet test src/ASync.App.Tests/ASync.App.Tests.csproj --configuration Release --no-build

  # The desktop app's installers and update feed (Velopack), async-cli archives, and the Linux .deb/.rpm, for every target
  # on its own OS (Velopack builds Windows packages only on Windows and macOS packages only on macOS): scripts/package.sh.
  # Signing runs only when its secrets exist (none yet: the builds are unsigned):
  #   Windows Authenticode: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
  #   macOS: MACOS_CERTIFICATE (base64 .p12 with the Developer ID Application and Installer identities),
  #          MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_APP_IDENTITY, MACOS_SIGN_INSTALL_IDENTITY;
  #          notarization also: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password)
  # Packages are built only once every test job has passed: a release needs all of them, and building them for a
  # failing commit only spends runner minutes (macOS and Windows ones above all).
  package:
    needs: [test, e2e, agent-desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-2025
          - rid: win-arm64
            os: windows-2025
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      NFPM_VERSION: '2.49.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Check the tag against VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Tag v$version instead."
            exit 1
          fi

      - name: Install vpk (Velopack CLI, version from .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: |
          arch=$([ "$(uname -m)" = aarch64 ] && echo arm64 || echo x86_64)
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" nfpm
          echo "NFPM=$RUNNER_TEMP/nfpm" >> "$GITHUB_ENV"

      # The latest published release of this channel, so vpk can make a delta package against it (none before the first).
      - name: Previous release (for delta updates)
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GITHUB_TOKEN"
          --channel ${{ matrix.rid }} -o artifacts/packages/${{ matrix.rid }}/velopack

      - name: Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          pfx="$RUNNER_TEMP/signing.pfx"
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$pfx"
          echo "WINDOWS_SIGN_PARAMS=/f $(cygpath -w "$pfx") /p $WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256" >> "$GITHUB_ENV"

      - name: macOS signing identities and notarization profile
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
          MACOS_SIGN_INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # The search list is the new keychain plus the existing ones, one word each.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          {
            echo "MACOS_KEYCHAIN=$keychain"
            echo "MACOS_SIGN_APP_IDENTITY=$MACOS_SIGN_APP_IDENTITY"
            echo "MACOS_SIGN_INSTALL_IDENTITY=$MACOS_SIGN_INSTALL_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY" = true ]; then
            xcrun notarytool store-credentials async-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "MACOS_NOTARY_PROFILE=async-notary" >> "$GITHUB_ENV"
          fi

      - name: Build the packages
        run: scripts/package.sh ${{ matrix.rid }}

      # Installs the .deb on Debian and the .rpm on Fedora in containers, then removes them (see the script).
      - name: Check the Linux packages
        if: matrix.rid == 'linux-x64'
        run: scripts/smoke-packages.sh artifacts/packages/linux-x64

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/packages/${{ matrix.rid }}/
          if-no-files-found: error

  # The Android app (src/ASync.App.Android, not in ASync.slnx: it needs the android workload): one sideloadable APK for
  # arm64 phones and x86_64 emulators, plus an AAB. Signed with the release keystore when its secrets exist
  # (ANDROID_KEYSTORE: the .jks in base64, ANDROID_KEY_ALIAS, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD), otherwise with
  # the runner's throw-away debug keystore (such an APK cannot update one signed differently).
  android:
    needs: [test, e2e, agent-desktop]
    runs-on: ubuntu-24.04
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the tag against VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Tag v$version instead."
            exit 1
          fi

      - name: Install the android workload and the SDK parts the project needs
        run: |
          dotnet workload install android
          dotnet build src/ASync.App.Android/ASync.App.Android.csproj -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Release keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "ASYNC_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "ASYNC_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ASYNC_ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "ASYNC_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        run: scripts/package-android.sh --aab

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: packages-android
          path: artifacts/packages/android/
          if-no-files-found: error

  # The GitHub Release for the tag, published, with every package and the Velopack feed (releases.<channel>.json per target):
  # the desktop app's update check reads published releases, so installed apps offer it at once. It runs only after the
  # tests, the end-to-end test and every package build have passed.
  release:
    needs: [test, e2e, agent-desktop, package, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist

      - name: Collect the release files
        run: |
          mkdir release
          for dir in dist/packages-*; do
            rid=${dir#dist/packages-}
            find "$dir" -maxdepth 1 -type f -exec cp {} release/ \;
            feed="$dir/velopack"
            [ -d "$feed" ] || continue # the Android APK has no Velopack feed
            # This release's own Velopack files (assets.<rid>.json): not the previous release vpk downloaded for deltas.
            jq -r '.[].RelativeFileName' "$feed/assets.$rid.json" | while read -r f; do cp "$feed/$f" release/; done
            names=$(jq -c '[.[].RelativeFileName]' "$feed/assets.$rid.json")
            jq --argjson names "$names" '.Assets |= map(select(.FileName as $f | $names | index($f)))' \
              "$feed/releases.$rid.json" > "release/releases.$rid.json"
            grep -F -f <(jq -r '.[].RelativeFileName' "$feed/assets.$rid.json") "$feed/RELEASES-$rid" > "release/RELEASES-$rid" || true
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release

      - name: Release notes
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          awk -v v="## v$version" 'index($0, v) == 1 { on = 1; next } on && /^## v/ { exit } on { print }' RELEASE_NOTES.md > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          | | |
          |---|---|
          | Windows (x64, ARM64) | `ASync.Desktop-win-x64-Setup.exe`, `ASync.Desktop-win-arm64-Setup.exe` |
          | macOS (Apple silicon) | `ASync-<version>-osx-arm64.dmg`, or `ASync.Desktop-osx-arm64-Setup.pkg` |
          | Linux (x64, ARM64) | `ASync.Desktop-linux-<arch>.AppImage` (updates itself), or `async-desktop` .deb / .rpm |
          | async-cli | `async-cli-<version>-<rid>` archives, `async-cli` .deb / .rpm, or the Docker image |
          | Android 8+ | `ASync-<version>-android.apk` (sideload: see "Installing the Android app" in the README) |

          These builds are not code-signed yet: see "Installing the desktop app" in the README for what Windows and macOS
          show and how to open them. `SHA256SUMS` lists every file's checksum.
          EOF
          sed -i "s/<version>/$version/g" notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run of the tag (or a draft made by hand): replace the files and publish it.
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "ASync $version" --notes-file notes.md
          fi

  # The real server stack (docker compose) with two async-cli agents plus one in the async-cli image: TwoWay, Mirror,
  # Backup (Transport and end-to-end), live updates and revocation. See scripts/e2e-sync.cs.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: End-to-end sync test
        run: scripts/e2e-sync.sh

  build-and-push:
    needs: [test, e2e, agent-desktop]
    # Pull requests only run the tests; images are published from version tags (and manual runs).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: async-server
            dockerfile: Dockerfile
            summary: "Self-hosted sync and backup server for all your devices: web UI, many users, S3/WebDAV/SFTP/SMB"
          - image: async-cli
            dockerfile: Dockerfile.cli
            summary: "ASync headless agent: syncs and backs up a server's folders through an ASync server"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          version=$(cat VERSION)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # A release tag must match VERSION, so the image tags and the version the app reports agree.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Tag v$version instead."
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Docker Hub's description is the README with its links pointing to GitHub and a link to the repository.
      # Only from release tags, so a manual run of another ref doesn't replace it.
      - name: Prepare Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/dockerhub-readme.mjs README.md > "$RUNNER_TEMP/dockerhub-readme.md"

      # Needs a Docker Hub token with the "Read, Write, Delete" scope (a "Read & Write" token can push but not edit descriptions).
      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          short-description: ${{ matrix.summary }}
          readme-filepath: ${{ runner.temp }}/dockerhub-readme.md
