name: Build and Publish Docker Images

# Images are published when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Pull requests only run the tests; a manual run (workflow_dispatch) builds and publishes the chosen ref.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build (warnings are errors)
        run: dotnet build ASync.slnx --configuration Release -warnaserror

      # Real S3 (SeaweedFS), SFTP, WebDAV and Samba servers for the storage back-end conformance tests.
      - name: Start storage test servers
        run: docker compose -f docker-compose.test.yml -p async-test up -d

      - name: Run tests
        run: |
          eval "$(scripts/test-backends-env.sh)"
          dotnet test src/ASync.Tests/ASync.Tests.csproj --configuration Release --no-build

      # The Docker image build runs `vite build` only, which does not type-check.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/async-ui/package-lock.json

      - name: Type-check and lint UI
        working-directory: src/async-ui
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npx eslint .

  # The real server stack (docker compose) with two async-cli agents plus one in the async-cli image: TwoWay, Mirror,
  # Backup (Transport and end-to-end), live updates and revocation. See scripts/e2e-sync.cs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: End-to-end sync test
        run: scripts/e2e-sync.sh

  build-and-push:
    needs: [test, e2e]
    # Pull requests only run the tests; images are published from version tags (and manual runs).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: async-server
            dockerfile: Dockerfile
          - image: async-cli
            dockerfile: Dockerfile.cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          version=$(cat VERSION)
          echo "value=$version" >> $GITHUB_OUTPUT
          # A release tag must match VERSION, so the image tags and the version the app reports agree.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Tag v$version instead."
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
